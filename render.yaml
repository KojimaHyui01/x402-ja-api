# Render Blueprint — "New > Blueprint" in the Render dashboard, point it at this repo.
# Free plan spins down after 15 min idle (30s+ cold start = agents see a dead endpoint);
# use Starter for an always-on instance.
services:
  - type: web
    name: x402-ja-api
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4021"
      - key: X402_NETWORK
        value: base
      - key: SERVICE_NAME
        value: ja-normalize
      - key: PUBLIC_BASE_URL
        sync: false   # set to the https://…onrender.com URL after first deploy
      - key: PAY_TO_ADDRESS
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: HOJIN_APP_ID
        sync: false
